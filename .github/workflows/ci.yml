name: ci

on:
  push:
    branches: [ "dev", "main" ] # ветки в которых настроен ci при пуше
  pull_request:
     branches: [ "dev", "main" ] # ветки в которых настроен ci при пулл реквестах

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend services # Чтобы не запускать контейнеры если хоть что-то не собирается
        run: |
          docker build -t content-service ./backend/content-service
          docker build -t feed-service ./backend/feed-service
          docker build -t profile-service ./backend/profile-service

      # TODO: добавить гео-апи сервис, сервис рекомендаций, когда будут готовы

      # TODO: добавить фронтенд когда будет

      - name: Run docker compose
        run: |
          docker compose -f deploy/docker-compose.yml config
          echo " Building up is ok"
      
      - name: Down docker compose
        run: docker compose -f deploy/docker-compose.yml down
