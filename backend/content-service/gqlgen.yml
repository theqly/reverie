schema:
  - graph/schema/scalars.graphqls
  - graph/schema/user.graphqls
  - graph/schema/board.graphqls
  - graph/schema/pin.graphqls
  - graph/schema/query.graphqls
  - graph/schema/mutation.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph/resolver
  package: resolver

models:
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID

  DateTime:
    model:
      - time.Time

federation:
  filename: graph/generated/federation.go
  package: generated
