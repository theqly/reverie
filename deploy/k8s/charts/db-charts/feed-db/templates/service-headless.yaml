apiVersion: v1
kind: Service
metadata:
  name: {{ include "feed-db.fullname" . }}-headless
  labels:
    {{- include "feed-db.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "feed-db.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
