
services:
  # Databases

  profile-db:
    image: postgres:15
    container_name: profile_db
    environment:
      POSTGRES_USER: ${PROFILE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROFILE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROFILE_POSTGRES_DB}
    ports:
      - "${PROFILE_DB_PORT}:${INNER_DB_PORT}"
    volumes:
      - profile_data:/var/lib/postgresql/data
    networks:
      - reverie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILE_POSTGRES_USER} -d ${PROFILE_POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  content-db:
    image: postgres:15
    container_name: content_db
    environment:
      POSTGRES_USER: ${CONTENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CONTENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONTENT_POSTGRES_DB}
    ports:
      - "${CONTENT_DB_PORT}:${INNER_DB_PORT}"
    volumes:
      - content_data:/var/lib/postgresql/data
    networks:
      - reverie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTENT_POSTGRES_USER} -d ${CONTENT_POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  feed-db:
    image: postgres:15
    container_name: feed_db
    environment:
      POSTGRES_USER: ${FEED_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FEED_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FEED_POSTGRES_DB}
    ports:
      - "${FEED_DB_PORT}:${INNER_DB_PORT}"
    volumes:
      - feed_data:/var/lib/postgresql/data
    networks:
      - reverie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FEED_POSTGRES_USER} -d ${FEED_POSTGRES_DB} -h localhost || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  # DB migrators runners

  profile-db-migrator:
    build:
      context: ../database/profile-db
      dockerfile: Dockerfile.migrator
    container_name: profile_db_migrator
    depends_on:
      profile-db:
        condition: service_healthy
    networks:
      - reverie-network
    entrypoint: ["migrate", "-path=/app/migrations", "-database=postgres://${PROFILE_POSTGRES_USER}:${PROFILE_POSTGRES_PASSWORD}@profile-db:${INNER_DB_PORT}/${PROFILE_POSTGRES_DB}?sslmode=disable", "up"]

  content-db-migrator:
    build:
      context: ../database/content-db
      dockerfile: Dockerfile.migrator
    container_name: content_db_migrator
    depends_on:
      content-db:
        condition: service_healthy
    networks:
      - reverie-network
    entrypoint: ["migrate", "-path=/app/migrations", "-database=postgres://${CONTENT_POSTGRES_USER}:${CONTENT_POSTGRES_PASSWORD}@content-db:${INNER_DB_PORT}/${CONTENT_POSTGRES_DB}?sslmode=disable", "up"]

  feed-db-migrator:
    build:
      context: ../database/feed-db
      dockerfile: Dockerfile.migrator
    container_name: feed_db_migrator
    depends_on:
      feed-db:
        condition: service_healthy
    networks:
      - reverie-network
    entrypoint: ["migrate", "-path=/app/migrations", "-database=postgres://${FEED_POSTGRES_USER}:${FEED_POSTGRES_PASSWORD}@feed-db:${INNER_DB_PORT}/${FEED_POSTGRES_DB}?sslmode=disable", "up"]

  # Backend

  profile-service:
    build:
      context: ../backend/profile-service
      dockerfile: Dockerfile
    container_name: profile_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROFILE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROFILE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROFILE_POSTGRES_DB}
      POSTGRES_HOST: profile-db
      PORT: ${INNER_SERVICE_PORT}
    depends_on:
      profile-db:
        condition: service_healthy
    ports:
      - "${PROFILE_PORT}:${INNER_SERVICE_PORT}"
    networks:
      - reverie-network
    #healthcheck:
    #  test: ["CMD-SHELL", "wget --spider --quiet http://localhost:${INNER_SERVICE_PORT}/healthz || exit 1"]
    #  interval: 5s
    #  timeout: 5s
    #  retries: 10
    #  start_period: 5s

  content-service:
    build:
      context: ../backend/content-service
      dockerfile: Dockerfile
    container_name: content_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONTENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CONTENT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONTENT_POSTGRES_DB}
      POSTGRES_HOST: content-db
      DB_PORT: ${CONTENT_DB_PORT}
      PORT: ${INNER_SERVICE_PORT}
    depends_on:
      content-db:
        condition: service_healthy
    ports:
      - "${CONTENT_PORT}:${INNER_SERVICE_PORT}"
    networks:
      - reverie-network
    #healthcheck:
    #  test: ["CMD-SHELL", "wget --spider --quiet http://localhost:${INNER_SERVICE_PORT}/healthz || exit 1"]
    #  interval: 5s
    #  timeout: 5s
    #  retries: 10
    #  start_period: 5s

  feed-service:
    build:
      context: ../backend/feed-service
      dockerfile: Dockerfile
    container_name: feed_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FEED_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FEED_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FEED_POSTGRES_DB}
      POSTGRES_HOST: feed-db
      PORT: ${INNER_SERVICE_PORT}
    depends_on:
      feed-db:
        condition: service_healthy
    ports:
      - "${FEED_PORT}:${INNER_SERVICE_PORT}"
    networks:
      - reverie-network
    #healthcheck:
    #  test: ["CMD-SHELL", "wget --spider --quiet http://localhost:${INNER_SERVICE_PORT}/healthz || exit 1"]
    #  interval: 5s
    #  timeout: 5s
    #  retries: 10
    #  start_period: 5s

  # Infra

  # keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:20.0.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://keycloak-db:${INNER_DB_PORT}/${KEYCLOAK_POSTGRES_DB}"
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT}:${INNER_SERVICE_PORT}"
    depends_on:
      - keycloak-db
    volumes:
      - ./keycloak/data:/opt/keycloak/data/import
    networks:
      - reverie-network

  keycloak-db:
    image: postgres:16
    container_name: keycloak_db
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_db_data:/var/lib/postgresql/data
    ports:
      - "${KEYCLOAK_DB_PORT}:${INNER_DB_PORT}"
    networks:
      - reverie-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KEYCLOAK_POSTGRES_USER}", "-d", "${KEYCLOAK_POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # opensearch

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - reverie-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - reverie-network

  # graphql stuff
  router:
    container_name: router
    image: ghcr.io/apollographql/apollo-runtime:latest
    ports:
      - "4000:4000"
    volumes:
      - rover_data:/config
    environment:
      APOLLO_ROUTER_CONFIG_PATH: /config/router_config.yaml
      APOLLO_ROUTER_SUPERGRAPH_PATH: /config/schema.graphql
    networks:
      - reverie-network

volumes:
  profile_data:
  content_data:
  feed_data:
  keycloak_postgres_db_data:
  rover_data:
    external: true
  opensearch_data:

networks:
  reverie-network:
    driver: bridge
