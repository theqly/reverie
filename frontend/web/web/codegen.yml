overwrite: true
# пока так
schema:
  - '../../../deploy/apollo/schemas/*.graphql'

# путь для поиска запросов, для которых нужно gql доки сгенерить
documents: './src/graphql/**/*.graphql'
generates:
  src/graphql/generated/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      withHooks: true
      apolloClientVersion: 3

      scalars:
        UUID:
          input: string
          output: string
        Time:
          input: string
          output: string

      strictScalars: true
      enumsAsConst: true
