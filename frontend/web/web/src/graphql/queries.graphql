query GetPinBasicById($id: UUID!) {
  pin(id: $id) {
    id
    name
    owner {
      id
      nickname
      profilePicture
    }
    images {
      id
      orderNumber
      imageUrl
    }
  }
}

query GetUserByNickTag($nickTag: String!) {
  userByTag(nickTag: $nickTag) {
    id
    nickname
    email
    nickTag
    profilePicture
    description
    status
    userRating
    followers {
      id
      nickname
    }
    following {
      id
      nickname
    }
  }
}

