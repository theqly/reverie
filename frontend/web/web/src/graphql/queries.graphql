mutation UpdateBoard($id: UUID!, $input: UpdateBoardInput!) {
  updateBoard(id: $id, input: $input) {
    id
    name
    description
    accessLevel
    ownerId
    authorId
    ownerType
    createdAt
    savedAt
    pins {
      id
      name
      owner {
        id
        nickname
        profilePicture
      }
      images {
        id
        orderNumber
        imageUrl
      }
    }
    reactionId
    bookmarked
  }
}


